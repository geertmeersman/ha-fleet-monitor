<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HA Fleet Monitor — Login</title>
    <link rel="icon" href="https://www.home-assistant.io/images/favicon-192x192.png">
    <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="w-full max-w-sm">
        <div class="bg-slate-800/40 border border-slate-700 rounded-xl p-8 shadow-lg">
            <div class="flex items-center gap-3 mb-8">
                <img src="https://www.home-assistant.io/images/favicon-192x192.png" class="w-8 h-8">
                <h1 class="text-xl font-bold text-slate-100">HA Fleet Monitor</h1>
            </div>

            {% if error %}
            <div class="mb-4 px-3 py-2 bg-rose-500/10 border border-rose-500/20 rounded text-xs text-rose-400">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Wachtwoord</label>
                    <input type="password" name="password" autofocus
                        class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
                </div>
                <button type="submit"
                    class="w-full px-4 py-2 text-sm rounded bg-sky-600 hover:bg-sky-500 text-white font-semibold">
                    Inloggen
                </button>
            </form>
        </div>
    </div>
</body>
</html>
