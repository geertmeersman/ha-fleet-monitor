{% from 'macros.html' import lang_switcher, theme_toggle, footer %}
<!DOCTYPE html>
<html lang="{{ session.get('lang', 'en') }}" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HA Fleet Monitor — {{ _('Login') }}</title>
    <link rel="icon" href="/static/ha-favicon.png">
    <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="w-full max-w-sm">
        <div class="bg-white dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 rounded-xl p-8 shadow-sm dark:shadow-lg">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-3">
                    <img src="/static/ha-favicon.png" class="w-8 h-8">
                    <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100">HA Fleet Monitor</h1>
                </div>
                <div class="flex gap-2">
                    {{ lang_switcher() }}
                    {{ theme_toggle() }}
                </div>
            </div>

            {% if error %}
            <div class="mb-4 px-3 py-2 bg-rose-500/10 border border-rose-500/20 rounded text-xs text-rose-500 dark:text-rose-400">
                {{ error }}
            </div>
            {% endif %}

            {% if step == 'totp' %}
            <form method="POST" action="/login/totp" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">{{ _('Authenticator code') }}</label>
                    <input type="text" name="code" autofocus autocomplete="one-time-code" inputmode="numeric" maxlength="6"
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-3 py-2 text-sm text-slate-800 dark:text-slate-100 tracking-widest text-center focus:outline-none focus:border-sky-500">
                </div>
                <button type="submit"
                    class="w-full px-4 py-2 text-sm rounded bg-sky-600 hover:bg-sky-500 text-white font-semibold">
                    {{ _('Verify') }}
                </button>
                <a href="/login" class="block text-center text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">← {{ _('Back') }}</a>
            </form>
            {% else %}
            <form method="POST" action="/login" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">{{ _('Password') }}</label>
                    <input type="password" name="password" autofocus
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-3 py-2 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-sky-500">
                </div>
                <button type="submit"
                    class="w-full px-4 py-2 text-sm rounded bg-sky-600 hover:bg-sky-500 text-white font-semibold">
                    {{ _('Login') }}
                </button>
            </form>
            {% endif %}
        </div>
        {{ footer(app_version) }}
    </div>
</body>
</html>
