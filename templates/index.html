{% from 'macros.html' import theme_toggle, icon, footer %}
<!DOCTYPE html>
<html lang="{{ session.get('lang', 'en') }}" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HA Fleet Monitor</title>
    <link rel="icon" href="/static/ha-favicon.png">
    <link rel="stylesheet" href="/static/tailwind.css">
</head>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-200 dark:border-slate-800 pb-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span><img src="/static/ha-favicon.png" class="w-7 h-7 inline"></span>
                HA Fleet Monitor
            </h1>
            <div class="flex items-center gap-4">
                <span id="last-update" class="text-xs text-slate-400 dark:text-slate-500">{{ _('Loading...') }}</span>
                <a href="/admin" class="text-xs text-sky-500 dark:text-sky-400 hover:underline flex items-center gap-1">{{ icon('settings', 'w-3.5 h-3.5') }} {{ _('Admin') }}</a>
                {{ theme_toggle() }}
                <a href="/logout" class="flex items-center gap-1 text-xs text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300">{{ icon('logout', 'w-3.5 h-3.5') }} {{ _('Logout') }}</a>
            </div>
        </header>

        <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

        <!-- Restart modal -->
        <div id="restart-modal"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-6 w-full max-w-sm shadow-2xl">
                <div class="flex items-center gap-3 mb-4">
                    <span class="text-slate-400 dark:text-slate-500"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></span>
                    <h2 class="text-base font-semibold text-slate-800 dark:text-slate-100" id="restart-modal-title"></h2>
                </div>
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-6" id="restart-modal-body"></p>
                <div class="flex justify-end gap-3">
                    <button onclick="closeRestartModal()"
                        class="px-4 py-2 text-sm rounded bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300">{{ _('Cancel') }}</button>
                    <button id="restart-modal-confirm"
                        class="px-4 py-2 text-sm rounded bg-orange-600 hover:bg-orange-500 text-white">{{ _('Restart') }}</button>
                </div>
            </div>
        </div>
        {{ footer(app_version) }}
    </div>

    <script>
        const T = {
            online: "{{ _('Online') }}",
            offline: "{{ _('Offline') }}",
            authError: "{{ _('Auth Error') }}",
            updatesAvailable: "{{ _('updates available') }}",
            updateAll: "{{ _('Update all') }}",
            install: "{{ _('Install') }}",
            upToDate: "{{ _('Up-to-date') }}",
            rebootRequired: "{{ _('Reboot required') }}",
            restartNow: "{{ _('Restart now') }}",
            restart: "{{ _('Restart') }}",
            version: "{{ _('Version') }}",
            lastUpdated: "{{ _('Last updated') }}",
            managed: "{{ _('Managed') }}",
            monitored: "{{ _('Monitored') }}",
            restartConfirm: "{{ _('Are you sure you want to restart this instance?') }}",
            restartConfirmBody: "{{ _('Home Assistant will be briefly unavailable.') }}",
            restartTitle: "{{ _('Restart') }}",
            cancel: "{{ _('Cancel') }}",
            restartSent: "{{ _('Restart sent') }}",
            failed: "{{ _('Failed') }}",
        };

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const instances = await res.json();

                const grid = document.getElementById('cards-grid');
                grid.innerHTML = '';

                function buildCard(inst) {
                    const isOnline = inst.status === 'online';
                    const hasAuthError = inst.status === 'auth_error';

                    let statusBadge = `<span class="px-2 py-1 text-xs rounded bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold border border-emerald-500/20">${T.online}</span>`;
                    if (!isOnline) {
                        statusBadge = hasAuthError
                            ? `<span class="px-2 py-1 text-xs rounded bg-amber-500/10 text-amber-600 dark:text-amber-400 font-semibold border border-amber-500/20">${T.authError}</span>`
                            : `<span class="px-2 py-1 text-xs rounded bg-rose-500/10 text-rose-600 dark:text-rose-400 font-semibold border border-rose-500/20">${T.offline}</span>`;
                    }

                    let updatesHtml = '';
                    if (inst.updates.length > 0) {
                        const entityIds = inst.updates.map(u => u.entity_id);
                        updatesHtml = `
                            <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-800">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-semibold text-amber-500 dark:text-amber-400 flex items-center gap-1"><svg class="w-3.5 h-3.5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/></svg> ${inst.updates.length} ${T.updatesAvailable}:</span>
                                    ${inst.managed ? `<button data-ids='${JSON.stringify(entityIds)}' data-inst='${inst.id}' onclick="installAll(this)" class="px-2 py-0.5 text-xs rounded bg-amber-600 hover:bg-amber-500 text-white">${T.updateAll}</button>` : ''}
                                </div>
                                <ul class="space-y-1">
                                    ${inst.updates.map(u => `<li class="text-xs text-slate-600 dark:text-slate-300 bg-slate-200/60 dark:bg-slate-800/60 p-1.5 rounded flex justify-between items-center"><span>${u.title}</span><div class="flex items-center gap-2"><span class="text-slate-400">${u.latest}</span>${inst.managed ? `<button onclick="installUpdate('${inst.id}', '${u.entity_id}', this)" class="px-2 py-0.5 text-xs rounded bg-sky-600 hover:bg-sky-500 text-white">${T.install}</button>` : ''}</div></li>`).join('')}
                                </ul>
                            </div>
                        `;
                    } else if (isOnline) {
                        updatesHtml = `<div class="mt-4 pt-4 border-t border-slate-200/50 dark:border-slate-800/50 text-xs text-slate-400 dark:text-slate-500">${T.upToDate}</div>`;
                    }

                    const rebootBanner = inst.reboot_required
                        ? `<div class="mt-3 flex items-center justify-between gap-2 bg-orange-500/10 border border-orange-500/20 rounded px-2 py-1.5">
                              <span class="text-xs text-orange-500 dark:text-orange-400 font-semibold flex items-center gap-1"><svg class="w-3.5 h-3.5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg> ${T.rebootRequired}</span>
                              ${inst.managed ? `<button onclick="restartInstance('${inst.id}', this)" class="px-2 py-0.5 text-xs rounded bg-orange-600 hover:bg-orange-500 text-white">${T.restartNow}</button>` : ''}
                           </div>`
                        : '';

                    const hasAlert = inst.updates.length > 0 || inst.reboot_required;
                    const cardBorder = hasAlert ? 'border-amber-500/50' : 'border-slate-200 dark:border-slate-800';

                    return `
                        <div data-card class="bg-white dark:bg-slate-800/40 border ${cardBorder} rounded-xl p-5 shadow-sm dark:shadow-lg flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h2 class="font-bold text-lg text-slate-800 dark:text-slate-200">${inst.name}</h2>
                                    <div class="flex flex-col items-end gap-1">
                                        ${statusBadge}
                                        ${isOnline && inst.managed ? `<button onclick="restartInstance('${inst.id}', this)" class="px-2 py-0.5 text-xs rounded bg-slate-200 dark:bg-slate-600 hover:bg-slate-300 dark:hover:bg-slate-500 text-slate-600 dark:text-slate-300 flex items-center gap-1"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> ${T.restart}</button>` : ''}
                                    </div>
                                </div>
                                <a href="${inst.url}" target="_blank" class="text-xs text-sky-500 dark:text-sky-400 hover:underline mb-3 inline-block">${inst.url}</a>
                                <p class="text-xs text-slate-400 dark:text-slate-400">${T.version}: <span class="text-slate-700 dark:text-slate-200 font-mono">${inst.version}</span></p>
                                ${rebootBanner}
                            </div>
                            ${updatesHtml}
                        </div>
                    `;
                }

                const managed = instances.filter(i => i.managed);
                const monitored = instances.filter(i => !i.managed);

                if (managed.length > 0) {
                    grid.innerHTML += `<div class="col-span-full text-xs font-semibold text-sky-500 dark:text-sky-400 uppercase tracking-widest mb-1 mt-2 flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg> ${T.managed}</div>`;
                    managed.forEach(inst => grid.innerHTML += buildCard(inst));
                }
                if (monitored.length > 0) {
                    grid.innerHTML += `<div class="col-span-full text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1 mt-4 flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg> ${T.monitored}</div>`;
                    monitored.forEach(inst => grid.innerHTML += buildCard(inst));
                }

                document.getElementById('last-update').innerText = T.lastUpdated + ': ' + new Date().toLocaleTimeString();

                const hasUpdates = instances.some(i => i.managed && (i.updates.length > 0 || i.reboot_required));
                updateFavicon(hasUpdates);
            } catch (err) {
                console.error("Error fetching status:", err);
            }
        }

        let faviconInterval = null;

        function updateFavicon(hasUpdates) {
            const link = document.querySelector('link[rel="icon"]');
            if (!hasUpdates) {
                clearInterval(faviconInterval);
                faviconInterval = null;
                link.href = '/static/ha-favicon.png';
                return;
            }
            if (faviconInterval) return;
            let toggle = false;
            faviconInterval = setInterval(() => {
                toggle = !toggle;
                link.href = toggle
                    ? '/static/ha-favicon.png'
                    : "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23f59e0b'/><text y='.9em' font-size='70' x='15'>📦</text></svg>";
            }, 1000);
        }

        fetchStatus();
        setInterval(fetchStatus, 30000);

        function closeRestartModal() {
            document.getElementById('restart-modal').classList.add('hidden');
        }

        document.getElementById('restart-modal').addEventListener('click', e => {
            if (e.target === document.getElementById('restart-modal')) closeRestartModal();
        });

        async function restartInstance(instanceId, btn) {
            const instName = btn.closest('[data-card]')?.querySelector('h2')?.textContent || instanceId;
            document.getElementById('restart-modal-title').textContent = instName + ' ' + T.restartTitle.toLowerCase();
            document.getElementById('restart-modal-body').textContent = T.restartConfirm + ' ' + T.restartConfirmBody;
            document.getElementById('restart-modal').classList.remove('hidden');

            const confirmBtn = document.getElementById('restart-modal-confirm');
            confirmBtn.onclick = async () => {
                confirmBtn.disabled = true;
                confirmBtn.textContent = '...';
                closeRestartModal();
                btn.disabled = true;
                btn.textContent = '...';
                const res = await fetch('/api/restart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instance_id: instanceId })
                });
                const data = await res.json();
                btn.textContent = data.status === 'ok' ? '✓ ' + T.restartSent : '✗ ' + T.failed;
                confirmBtn.disabled = false;
                confirmBtn.textContent = T.restartTitle;
            };
        }

        async function installUpdate(instanceId, entityId, btn) {
            btn.disabled = true;
            btn.textContent = '...';
            const res = await fetch('/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ instance_id: instanceId, entity_id: entityId })
            });
            const data = await res.json();
            btn.textContent = data.status === 'ok' ? '✓' : '✗';
        }

        async function installAll(btn) {
            const instanceId = btn.dataset.inst;
            const entityIds = JSON.parse(btn.dataset.ids);
            btn.disabled = true;
            btn.textContent = '...';
            const li_buttons = btn.closest('div').nextElementSibling.querySelectorAll('button');
            for (let i = 0; i < entityIds.length; i++) {
                if (li_buttons[i]) { li_buttons[i].disabled = true; li_buttons[i].textContent = '...'; }
                await fetch('/api/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instance_id: instanceId, entity_id: entityIds[i] })
                });
                if (li_buttons[i]) li_buttons[i].textContent = '✓';
            }
            btn.textContent = '✓';
        }
    </script>
</body>

</html>
