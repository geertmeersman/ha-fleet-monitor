<!DOCTYPE html>
<html lang="nl" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HA Fleet Monitor</title>
    <link rel="icon" href="https://www.home-assistant.io/images/favicon-192x192.png">
    <link rel="stylesheet" href="/static/tailwind.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span><img src="https://www.home-assistant.io/images/favicon-192x192.png" class="w-7 h-7 inline"></span> HA Fleet Monitor
            </h1>
            <span id="last-update" class="text-xs text-slate-500">Aan het laden...</span>
            <a href="/admin" class="text-xs text-sky-400 hover:underline">⚙️ Beheer</a>
            <a href="/logout" class="text-xs text-slate-500 hover:text-slate-300">Uitloggen</a>
        </header>

        <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards worden dynamisch ingeladen -->
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const instances = await res.json();

                const grid = document.getElementById('cards-grid');
                grid.innerHTML = '';

                function buildCard(inst) {
                    const isOnline = inst.status === 'online';
                    const hasAuthError = inst.status === 'auth_error';

                    let statusBadge = '<span class="px-2 py-1 text-xs rounded bg-emerald-500/10 text-emerald-400 font-semibold border border-emerald-500/20">Online</span>';
                    if (!isOnline) {
                        statusBadge = hasAuthError
                            ? '<span class="px-2 py-1 text-xs rounded bg-amber-500/10 text-amber-400 font-semibold border border-amber-500/20">Auth Error</span>'
                            : '<span class="px-2 py-1 text-xs rounded bg-rose-500/10 text-rose-400 font-semibold border border-rose-500/20">Offline</span>';
                    }

                    let updatesHtml = '';
                    if (inst.updates.length > 0) {
                        const entityIds = inst.updates.map(u => u.entity_id);
                        updatesHtml = `
                            <div class="mt-4 pt-4 border-t border-slate-800">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-semibold text-amber-400">📦 ${inst.updates.length} Updates beschikbaar:</span>
                                    <button data-ids='${JSON.stringify(entityIds)}' data-inst='${inst.id}' onclick="installAll(this)" class="px-2 py-0.5 text-xs rounded bg-amber-600 hover:bg-amber-500 text-white">Alles updaten</button>
                                </div>
                                <ul class="space-y-1">
                                    ${inst.updates.map(u => `<li class="text-xs text-slate-300 bg-slate-800/60 p-1.5 rounded flex justify-between items-center"><span>${u.title}</span><div class="flex items-center gap-2"><span class="text-slate-400">${u.latest}</span><button onclick="installUpdate('${inst.id}', '${u.entity_id}', this)" class="px-2 py-0.5 text-xs rounded bg-sky-600 hover:bg-sky-500 text-white">Installeer</button></div></li>`).join('')}
                                </ul>
                            </div>
                        `;
                    } else if (isOnline) {
                        updatesHtml = '<div class="mt-4 pt-4 border-t border-slate-800/50 text-xs text-slate-500">Up-to-date</div>';
                    }

                    const rebootBanner = inst.reboot_required
                        ? `<div class="mt-3 flex items-center justify-between gap-2 bg-orange-500/10 border border-orange-500/20 rounded px-2 py-1.5">
                              <span class="text-xs text-orange-400 font-semibold">⚠️ Herstart vereist</span>
                              <button onclick="restartInstance('${inst.id}', this)" class="px-2 py-0.5 text-xs rounded bg-orange-600 hover:bg-orange-500 text-white">Nu herstarten</button>
                           </div>`
                        : '';

                    return `
                        <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h2 class="font-bold text-lg text-slate-200">${inst.name}</h2>
                                    <div class="flex flex-col items-end gap-1">
                                        ${statusBadge}
                                        ${isOnline && inst.managed ? `<button onclick="restartInstance('${inst.id}', this)" class="px-2 py-0.5 text-xs rounded bg-slate-600 hover:bg-slate-500 text-slate-300">🔄 Herstart</button>` : ''}
                                    </div>
                                </div>
                                <a href="${inst.url}" target="_blank" class="text-xs text-sky-400 hover:underline mb-3 inline-block">${inst.url}</a>
                                <p class="text-xs text-slate-400">Versie: <span class="text-slate-200 font-mono">${inst.version}</span></p>
                                ${rebootBanner}
                            </div>
                            ${updatesHtml}
                        </div>
                    `;
                }

                const managed = instances.filter(i => i.managed);
                const monitored = instances.filter(i => !i.managed);

                if (managed.length > 0) {
                    grid.innerHTML += `<div class="col-span-full text-xs font-semibold text-sky-400 uppercase tracking-widest mb-1 mt-2">🔧 Managed</div>`;
                    managed.forEach(inst => grid.innerHTML += buildCard(inst));
                }
                if (monitored.length > 0) {
                    grid.innerHTML += `<div class="col-span-full text-xs font-semibold text-slate-500 uppercase tracking-widest mb-1 mt-4">👁 Monitored</div>`;
                    monitored.forEach(inst => grid.innerHTML += buildCard(inst));
                }

                document.getElementById('last-update').innerText = 'Laatst bijgewerkt: ' + new Date().toLocaleTimeString();
            } catch (err) {
                console.error("Fout bij ophalen status:", err);
            }
        }

        fetchStatus();
        // Ververs automatisch elke 30 seconden
        setInterval(fetchStatus, 30000);

        async function restartInstance(instanceId, btn) {
            if (!confirm('Weet je zeker dat je deze instantie wil herstarten?')) return;
            btn.disabled = true;
            btn.textContent = '...';
            const res = await fetch('/api/restart', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({instance_id: instanceId})
            });
            const data = await res.json();
            btn.textContent = data.status === 'ok' ? '✓ Herstart verzonden' : '✗ Mislukt';
        }

        async function installUpdate(instanceId, entityId, btn) {
            btn.disabled = true;
            btn.textContent = '...';
            const res = await fetch('/api/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({instance_id: instanceId, entity_id: entityId})
            });
            const data = await res.json();
            btn.textContent = data.status === 'ok' ? '✓' : '✗';
        }

        async function installAll(btn) {
            const instanceId = btn.dataset.inst;
            const entityIds = JSON.parse(btn.dataset.ids);
            btn.disabled = true;
            btn.textContent = '...';
            const li_buttons = btn.closest('div').nextElementSibling.querySelectorAll('button');
            for (let i = 0; i < entityIds.length; i++) {
                if (li_buttons[i]) { li_buttons[i].disabled = true; li_buttons[i].textContent = '...'; }
                await fetch('/api/update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({instance_id: instanceId, entity_id: entityIds[i]})
                });
                if (li_buttons[i]) li_buttons[i].textContent = '✓';
            }
            btn.textContent = '✓';
        }
    </script>
</body>

</html>
